[package]
name = "zuoer"
version = "0.2.0"
edition = "2024"
rust-version = "1.88"
repository = "https://github.com/findit-studio/zuoer"
homepage = "https://github.com/findit-studio/zuoer"
documentation = "https://docs.rs/zuoer"
description = "Domain-neutral run segmenter: the Silero-derived hysteresis state machine that turns any frame-probability sequence into contiguous runs with mean/peak aggregates — one instance per class for sound-event detection. Over it sits a backend-agnostic voice-activity-detection (VAD) shell: the VadBackend seam and the Speech* names. The model, inference runtime, and audio I/O live in the backend crate."
keywords = ["segmentation", "hysteresis", "event-detection", "vad", "speech"]
categories = ["multimedia::audio", "algorithms", "artificial-intelligence"]
license = "MIT OR Apache-2.0"
readme = "README.md"
include = [
  "Cargo.toml",
  "README.md",
  "LICENSE-APACHE",
  "LICENSE-MIT",
  "src/**",
  "build.rs",
]

[features]
default = []
# Derive `Serialize`/`Deserialize` for the public `SpeechOptions` /
# `SampleRate` configuration types so callers can persist VAD configuration
# (e.g. JSON/TOML profiles). `Duration` fields go through `humantime-serde`
# ("250ms" / "1.5s" rather than raw nanos). Off by default.
serde = ["dep:serde", "dep:humantime-serde"]

[dependencies]
thiserror = "2"

serde = { version = "1", optional = true, features = ["derive"] }
humantime-serde = { version = "1", optional = true }

[dev-dependencies]
serde_json = "1"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints.rust]
rust_2018_idioms = "warn"
single_use_lifetimes = "warn"
# `tarpaulin` is set by `build.rs` (and the coverage CI job's RUSTFLAGS) so
# the `#[cfg_attr(not(tarpaulin), inline(always))]` hints are recognized.
unexpected_cfgs = { level = "warn", check-cfg = [
  'cfg(all_tests)',
  'cfg(tarpaulin)',
] }
